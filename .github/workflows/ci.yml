name: package-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 15
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test tools
        run: python -m pip install --upgrade pip build pytest setuptools wheel

      - name: Bind installer to matrix Python
        run: python -c "import os,sys; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8').write('PYTHON_BIN='+sys.executable+'\n')"

      - name: Build wheel and sdist
        run: python scripts/build_release.py

      - name: Verify manifest and checksums
        run: python scripts/verify_release.py

      - name: Stage the pricing certificate dependency locally
        run: |
          python -m pip download --only-binary=:all: --no-deps --dest wheelhouse "certifi>=2024.2.2"
          python -c "import shutil; shutil.copy2('dist/helixengine-0.1.0-py3-none-any.whl', 'wheelhouse/helixengine-0.1.0-py3-none-any.whl')"

      - name: Install wheel without an index
        run: python -m pip install --no-index --find-links wheelhouse --find-links dist --force-reinstall helixengine==0.1.0

      - name: Smoke test installed wheel outside source tree
        run: python scripts/test_installed.py

      - name: Exercise the installed wheel helper and desktop shortcut
        if: runner.os != 'Windows'
        run: |
          bash scripts/install.sh --offline wheelhouse/helixengine-0.1.0-py3-none-any.whl
          python scripts/test_shortcut.py

      - name: Exercise the installed wheel helper and desktop shortcut on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\install.ps1 -Offline -WheelPath .\wheelhouse\helixengine-0.1.0-py3-none-any.whl
          python .\scripts\test_shortcut.py

      - name: Install sdist without an index
        run: python -m pip install --no-index --no-deps --no-build-isolation --force-reinstall dist/helixengine-0.1.0.tar.gz

      - name: Smoke test installed sdist
        run: python scripts/test_installed.py

  browser:
    timeout-minutes: 10
    name: Ubuntu browser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and Playwright
        run: python -m pip install . playwright

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: python tests/browser_smoke.py --output browser-artifacts

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: browser-artifacts
          if-no-files-found: warn
